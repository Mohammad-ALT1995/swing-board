<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing Board</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEDEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Swing Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* LongView's own language, so the board can become one of its tabs: warm neutral ground,
   serif titles, small uppercase kickers, quiet cards, a bronze accent, go/hold/no pills.
   Layout: one column for a phone, five tabs at the thumb, cards that open on tap. */
:root {
  --bg:#ECEDEA; --surface:#FCFCFB; --surface-2:#F3F4F1; --sunken:#E4E6E2; --line:#D6D8D3; --hair:#E7E9E5;
  --ink:#191B18; --ink-2:#4A4F49; --ink-3:#7C827A;
  --accent:#7A6234; --accent-soft:#EFE8DA; --deep:#2E4B5C;
  --go:#2C6B4F; --go-bg:#DFEDE4; --hold:#8A6A1F; --hold-bg:#F3E9D2; --no:#9E3B2E; --no-bg:#F5DFDB;
  --up:#1E8A5F; --down:#C0483A; --lvl:#2D6FA8;
  --shadow:0 1px 2px rgba(25,27,24,.05), 0 6px 20px rgba(25,27,24,.05); --r:12px;
  --serif:ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  --sans:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#111311; --surface:#191C19; --surface-2:#1F2320; --sunken:#141715; --line:#2C312D; --hair:#232725;
  --ink:#E8EAE6; --ink-2:#B0B6AE; --ink-3:#7E857D; --accent:#C4A462; --accent-soft:#2A241A; --deep:#8FB4C7;
  --go:#57A97D; --go-bg:#152A20; --hold:#D2A84A; --hold-bg:#2A2415; --no:#DC6E5E; --no-bg:#2C1A17;
  --up:#3FB27E; --down:#E0655A; --lvl:#7FBCEB; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#111311; --surface:#191C19; --surface-2:#1F2320; --sunken:#141715; --line:#2C312D; --hair:#232725;
  --ink:#E8EAE6; --ink-2:#B0B6AE; --ink-3:#7E857D; --accent:#C4A462; --accent-soft:#2A241A; --deep:#8FB4C7;
  --go:#57A97D; --go-bg:#152A20; --hold:#D2A84A; --hold-bg:#2A2415; --no:#DC6E5E; --no-bg:#2C1A17;
  --up:#3FB27E; --down:#E0655A; --lvl:#7FBCEB; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3); color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kicker { margin: 0; font: 600 11.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 600 34px/1.04 var(--serif); letter-spacing: -.02em; text-wrap: balance; }

/* lock */
#lock { min-height: 100vh; display: grid; place-items: center; padding-block: 40px; }
#lock form { width: min(360px, 100%); display: grid; gap: 12px; }
#lock .sub { margin: 0 0 6px; font: italic 16px/1.45 var(--serif); color: var(--ink-2); }
input[type=password], input[type=search] { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.btn { padding: 11px 14px; border: 0; border-radius: 10px; background: var(--ink); color: var(--surface); font-weight: 600; cursor: pointer; }
.btn.small { padding: 6px 12px; font-size: 12.5px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.err { color: var(--no); font-size: 13px; margin: 0; min-height: 1.2em; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* masthead */
header.mast { background: var(--bg); padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
header.mast .wrap { display: grid; gap: 8px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.mast-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 10px 3px 9px; border-radius: 999px; font: 600 11px/1 var(--sans);
  letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.live.on { color: var(--go); background: var(--go-bg); border-color: transparent; }
.live.on i { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent); }
.live.off { color: var(--no); background: var(--no-bg); border-color: transparent; } .live.off i { background: var(--down); }
.stamps { margin: 0; font-size: 12.5px; color: var(--ink-3); }

main { padding-block: 18px calc(88px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 26px; }
section { display: grid; gap: 10px; min-width: 0; }
.sec { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec h2 { margin: 0; font: 600 22px/1.15 var(--serif); letter-spacing: -.01em; }
.cnt { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.note, .none { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.none { color: var(--ink-3); font-style: italic; font-family: var(--serif); font-size: 15px; }
ul { margin: 0; padding: 0; list-style: none; }

/* summary pills */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; letter-spacing: .03em; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.pill b { color: var(--ink); }
.pill.hot { background: var(--no-bg); border-color: transparent; color: var(--no); font-weight: 600; }
.pill.go { background: var(--go-bg); border-color: transparent; color: var(--go); font-weight: 600; }

/* alerts */
.alerts { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--down); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.alerts .kicker { color: var(--down); }
.alert { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.alert b { font-weight: 700; letter-spacing: -.01em; }
.alert span { font-size: 13px; color: var(--ink-2); }
.alert em { font-style: normal; color: var(--accent); font-size: 13px; grid-row: 1; grid-column: 2; }

/* chips and filters */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { display: inline-flex; background: var(--sunken); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--ink-2); font: 600 12px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font: 700 9.5px/1.5 var(--sans); letter-spacing: .1em; }
.tag.short { color: var(--no); background: var(--no-bg); } .tag.held { color: var(--deep); background: color-mix(in srgb, var(--deep) 12%, var(--surface)); }
.tag.new { color: var(--go); background: var(--go-bg); } .tag.exit { color: #fff; background: var(--ink-2); }
.tag.earn { color: var(--surface); background: var(--deep); }
.alerts.warnbox { border-left-color: var(--hold); } .alerts.warnbox .kicker { color: var(--hold); }
.exl { display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.exl div { background: var(--surface); padding: 9px 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
.exl b { font-size: 15px; }
.lns { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.ln { all: unset; box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; padding: 10px 14px; border-top: 1px solid var(--hair); cursor: pointer; }
.ln:first-child { border-top: 0; } .ln b { font-size: 16px; } .ln .stat { min-width: 0; }
.lnp { margin-left: auto; font-weight: 600; white-space: nowrap; } .lnp i { font-style: normal; }
.lnw { flex-basis: 100%; font-size: 12.5px; color: var(--ink-2); } .exl .src { margin-left: auto; font-size: 11.5px; color: var(--ink-3); } .tag.watch, .tag.prov { color: var(--hold); background: var(--hold-bg); }

/* setup cards */
.cards { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.card + .card { border-top: 1px solid var(--hair); }
.card { position: relative; min-width: 0; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.card > button { all: unset; box-sizing: border-box; width: 100%; display: grid; gap: 4px; padding: 12px 14px 11px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.l1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; min-width: 0; }  /* wraps on a narrow phone instead of pushing the price off screen */
.rank { font-size: 12px; color: var(--ink-3); width: 1.5em; flex: none; }
.tk { font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
/* G = Gareth posted or spoke about it (a badge, so it is never read as a star rating) */
.tk.g::after, .gb { content: "G"; display: inline-block; margin-left: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--surface); font: 700 10px/16px var(--sans); text-align: center; vertical-align: 2px; letter-spacing: 0; }
.st { color: var(--accent); font-size: 13px; letter-spacing: .04em; }
.dist { margin-left: auto; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.card.hot .dist { color: var(--down); } .card.warn .dist { color: var(--hold); } .card.near .dist { color: var(--accent); }
.l2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 13px; color: var(--ink-2); }
.l2 b { color: var(--ink); font-weight: 600; }
.l2 .lv { color: var(--lvl); font-weight: 600; }
.l2 .on { color: var(--up); }
/* status in words: the first thing on every card */
.stat { display: inline-block; flex: none; min-width: 84px; text-align: center; padding: 3px 8px; border-radius: 6px; font: 700 11.5px/1.4 var(--sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.s-at { background: var(--down); color: #fff; }
.s-near { background: var(--accent); color: var(--surface); }
.s-close { background: var(--go-bg); color: var(--go); }
.s-warn { background: var(--hold-bg); color: var(--hold); }
.s-mid { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.s-far, .s-none { background: var(--sunken); color: var(--ink-3); }
.pxr { margin-left: auto; text-align: right; white-space: nowrap; font-size: 14px; }
.pxr b { font-size: 15.5px; }
.shb { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sh-yes { background: var(--go-bg); color: var(--go); } .sh-split { background: var(--hold-bg); color: var(--hold); }
.sh-no { background: var(--no-bg); color: var(--no); } .sh-wait { background: var(--sunken); color: var(--ink-3); }
.grp { margin: 0; font: 700 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.grp .stat { min-width: 0; }
.ctrl { display: grid; gap: 8px; }
select.an { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: 600 12.5px var(--sans); }
.shtog { margin-left: 6px; } #gan { margin-left: auto; }
.frow { display: flex; gap: 8px; align-items: center; }
.frow input { flex: 1; min-width: 0; }
.fbtn { flex: none; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.fbtn[aria-expanded="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.fpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px; }
.fpanel .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 -4px; }
.fsum { font-size: 12.5px; color: var(--ink-2); }
.mv-up { color: var(--up); font-weight: 600; } .mv-dn { color: var(--down); font-weight: 600; }
.card.fl-up > button { animation: flup 1.6s ease-out; } .card.fl-dn > button { animation: fldn 1.6s ease-out; }
@keyframes flup { 0%, 35% { background: color-mix(in srgb, var(--up) 30%, transparent); } 100% { background: transparent; } }
@keyframes fldn { 0%, 35% { background: color-mix(in srgb, var(--down) 28%, transparent); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .card.fl-up > button, .card.fl-dn > button { animation: none; } }
.when { font-size: 12px; color: var(--ink-3); }
.more { display: grid; gap: 10px; padding: 0 14px 14px 16px; font-size: 13.5px; }
.more dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; }
.more dt { color: var(--ink-3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
.more dd { margin: 0; overflow-wrap: anywhere; }
.tl { display: grid; gap: 6px; padding-left: 12px; border-left: 2px solid var(--hair); }
.tl li { font-size: 13px; color: var(--ink-2); }
.tl time { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* posts feed */
.day { display: grid; gap: 8px; }
.day h3 { margin: 0; font: 600 11.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.post { padding: 12px 14px; display: grid; gap: 4px; }
.post + .post { border-top: 1px solid var(--hair); }
.post .meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; }
.post .t { font-weight: 600; line-height: 1.35; }
.post .n { font-size: 13.5px; color: var(--ink-2); }
.post .tks { display: flex; gap: 5px; flex-wrap: wrap; }
.post .tks button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
.post .tks button.ok { color: var(--go); background: var(--go-bg); border-color: transparent; }
.post .tks button.no { color: var(--no); background: var(--no-bg); border-color: transparent; text-decoration: line-through; }
.post .tks button.wait { color: var(--hold); background: var(--hold-bg); border-color: transparent; }
.post a { color: var(--deep); font-size: 12.5px; }

/* prose blocks */
.rule { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.bul { display: grid; gap: 8px; }
.bul li { padding-left: 14px; position: relative; overflow-wrap: anywhere; }
.bul li::before { content: ""; position: absolute; left: 0; top: .66em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.mv { display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.mv div { background: var(--surface); padding: 10px 14px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.mv dt, .mv b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; font-weight: 600; }
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.fold > summary { padding: 12px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; margin-left: auto; color: var(--ink-3); }
details.fold[open] > summary::after { content: "▴"; }
details.fold > div { padding: 0 14px 14px; display: grid; gap: 10px; }
details.fold .cards { box-shadow: none; }
table.key { border-collapse: collapse; font-size: 13px; width: 100%; }
table.key td { padding: 5px 6px; border-top: 1px solid var(--hair); vertical-align: top; }
footer { color: var(--ink-3); font-size: 12px; display: grid; gap: 4px; font-style: italic; font-family: var(--serif); }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .row { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 1px; font-size: 11px; font-weight: 500; color: var(--ink-3); cursor: pointer; position: relative; }
nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
nav.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--accent); border-radius: 2px; }
.badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--down); color: #fff; font: 700 10.5px/17px var(--sans); }
@media (prefers-reduced-motion: no-preference) { .card .more { animation: drop .16s ease-out; } @keyframes drop { from { opacity: 0; transform: translateY(-3px); } } }
</style>
</head>
<body>
<div id="lock" class="wrap">
  <form id="lockForm" autocomplete="on">
    <p class="kicker">Verified Investing · Gareth Soloway</p>
    <h1>Swing Board</h1>
    <p class="sub">The analysts' levels, ranked by your rules.</p>
    <input name="username" value="swing-board" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <label class="chk"><input id="remember" type="checkbox" checked> Remember on this phone</label>
    <button class="btn" type="submit">Open</button>
    <p class="err" id="lockErr" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="mast"><div class="wrap">
    <p class="kicker">Verified Investing · Gareth Soloway</p>
    <div class="mast-row"><h1>Swing Board</h1><span class="live" id="live"><i></i><span id="liveTxt">Cloud</span></span><select class="an" id="gan" aria-label="Analyst"><option value="">All analysts</option></select><button class="chip shtog" type="button" id="shtog" aria-pressed="true">Shariah only</button></div>
    <p class="stamps" id="stamps"></p>
  </div></header>
  <main class="wrap">
    <div class="view" id="v-today"></div>
    <div class="view" id="v-board" hidden></div>
    <div class="view" id="v-mine" hidden></div>
    <div class="view" id="v-posts" hidden></div>
    <div class="view" id="v-market" hidden></div>
  </main>
  <nav class="tabs" aria-label="Sections"><div class="row" role="tablist">

      query = ""; filters.side = t.dataset.goto === "exited" ? "all" : "long"; filters.sort = "close";
      if (t.dataset.goto === "fresh") filters.fresh = true;
      if (t.dataset.goto === "exited") filters.exited = true;
      store(FILT, JSON.stringify(filters)); tab = "board"; render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.find) { query = t.dataset.find; tab = "board"; render(); window.scrollTo(0, 0); return; }
    if (t.id === "ackAlerts") ackAlerts();
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id !== "an" && ev.target.id !== "gan") return;
    filters.an = ev.target.value; store(FILT, JSON.stringify(filters)); render();
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id !== "search") return;
    query = ev.target.value; var pos = ev.target.selectionStart; render();
    var s = document.getElementById("search"); if (s) { s.focus(); s.setSelectionRange(pos, pos); }
  });

  /* ---------- live prices while the app is open ----------
     Finnhub's free key (about 60 asks a minute). The names closest to action are asked
     every cycle (about once a minute), the rest in rotation; nothing is asked while the US
     market is shut, the app is hidden or no key is set. As a LongView tab, LongView's own
     feed would take Finnhub's place. Live prices only move the screen: the ledger keeps
     the cloud runs' prices. */
  var FUTURES = /^(GOLD|SILVER|COPPER|PLATINUM|PALLADIUM|NATGAS|USOIL|SPX)$/;
  var PER_CYCLE = 50, HOT_MAX = 25, GAP_MS = 1150, rotate = 0, running = false, notified = {}, dirty = false;
  // NYSE holidays and 13:00 early closes (nyse.com), to the end of 2027
  var HOLIDAYS = "2026-11-26 2026-12-25 2027-01-01 2027-01-18 2027-02-15 2027-03-26 2027-05-31 2027-06-18 2027-07-05 2027-09-06 2027-11-25 2027-12-24";
  var EARLY = "2026-11-27 2026-12-24 2027-11-26";
  function nyNow() {
    var p = {}; new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false })
      .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return { day: p.weekday, date: p.year + "-" + p.month + "-" + p.day, min: (+p.hour % 24) * 60 + (+p.minute) };
  }
  function tradingDay(n) { return !/Sat|Sun/.test(n.day) && HOLIDAYS.indexOf(n.date) < 0; }
  function marketOpen() { var n = nyNow(); return tradingDay(n) && n.min >= 570 && n.min < (EARLY.indexOf(n.date) >= 0 ? 780 : 960); }

  /* ---------- is the cloud reader on time? ----------
     Runs: weekdays every hour at :15 New York, and Sunday 20:15. Allow some slack. */
  function staleMsg() {
    var t = parseAt(D.updatedAt); if (!t) return "";
    var mins = (Date.now() - t) / 60000, n = nyNow();
    var limit = tradingDay(n) && n.min >= 120 ? 105 : 52 * 60; // the first hours of Monday still follow Sunday's single run
    if (mins <= limit) return "";
    var h = mins < 120 ? Math.round(mins) + " min" : mins < 2880 ? Math.round(mins / 60) + " hours" : Math.round(mins / 1440) + " days";
    return "The cloud reader last ran " + h + " ago. Prices still move live, but new posts are not being read.";
  }

  /* the phone reads Gareth's videos (Google blocks the cloud); say when it stops */
  function phoneMsg() {
    var p = D.phone; if (!p) return "";
    if (p.problem) return p.problem + (/login/i.test(p.problem) ? ". Public videos are still read; members-only videos wait until then." : ". Until then Gareth's videos are not read.");
    var t = parseAt(p.checkedAt), h = t ? (Date.now() - t) / 3600000 : 99;
    return h > 12 ? "Your phone has not checked YouTube for " + Math.round(h) + " hours. Check it has internet and that Termux is installed." : "";
  }

  /* ---------- earnings in the next 7 days (Finnhub's calendar, once a day) ---------- */
  var EARN = "swingboard.earnings2", earn = {};  // "2": earlier caches counted GOLD (Barrick) as gold
  async function loadEarnings() {
    var day = new Date().toISOString().slice(0, 10);
    try { var c = JSON.parse(store(EARN) || "null"); if (c && c.day === day) { earn = c.map; dirty = true; return; } } catch (e) { /* ask again */ }
    try {
      var r = await fetch("https://finnhub.io/api/v1/calendar/earnings?from=" + day + "&to=" + new Date(Date.now() + 8 * DAY).toISOString().slice(0, 10) + "&token=" + encodeURIComponent(D.finnhub));
      if (!r.ok) return;
      var want = {}, map = {};
      D.rows.forEach(function (x) { if (!FUTURES.test(x.t)) want[x.t] = 1; });  // GOLD here is gold, not Barrick
      ((await r.json()).earningsCalendar || []).forEach(function (e) { if (want[e.symbol] && (!map[e.symbol] || e.date < map[e.symbol].d)) map[e.symbol] = { d: e.date, h: e.hour }; });
      earn = map; store(EARN, JSON.stringify({ day: day, map: map })); dirty = true;
    } catch (e) { /* no calendar today: cards just show no earnings tag */ }
  }
  function earnOf(r) {
    var e = !FUTURES.test(r.t) && earn[r.t]; if (!e) return null;
    var days = Math.round((new Date(e.d + "T12:00:00Z") - Date.now()) / DAY);
    if (days < -1 || days > 7) return null;
    var when = new Date(e.d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" });
    return { short: new Date(e.d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short" }),
             long: when + ({ bmo: ", before the open", amc: ", after the close", dmh: ", during the day" }[e.h] || "") };
  }

  /* ---------- new data without reloading: the cloud rebuilds the page every run ---------- */
  async function refreshData() {
    if (!KEY || document.hidden) return;
    try {
      var r = await fetch(location.pathname + "?r=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      var page = await r.text(), v = page.match(/var APPVER = "([^"]*)"/);
      if (v && v[1] !== APPVER && !/APPVER/.test(APPVER) && store(KEY_STORE)) { location.reload(); return; }  // a new app version
      var m = page.match(/<script id="payload" type="application\/json">([\s\S]*?)<\/script>/);
      if (!m) return;
      var p = JSON.parse(m[1]);
      if (p.iv === payload.iv) return;
      var plain = await openBox(p, KEY);
      payload = p; D = JSON.parse(new TextDecoder().decode(plain)); dirty = true; softRender();
    } catch (e) { /* offline or mid-deploy: try again next time */ }
  }
  function tickers(rows) { var out = []; rows.forEach(function (r) { if (!FUTURES.test(r.t) && out.indexOf(r.t) < 0) out.push(r.t); }); return out; }
  function cycleList() {
    var rows = openRows().slice().sort(rankKey);
    var hot = tickers(rows.filter(function (r) { var d = dist(r); return held(r) || stars(r) >= 2 || (isNum(d) && Math.abs(d) <= 3); })).slice(0, HOT_MAX);
    var rest = tickers(rows).filter(function (t) { return hot.indexOf(t) < 0; });
    var take = [];
    for (var k = 0; k < PER_CYCLE - hot.length && rest.length; k++) take.push(rest[(rotate + k) % rest.length]);
    rotate = rest.length ? (rotate + take.length) % rest.length : 0;
    return hot.concat(take.filter(function (t, i, a) { return a.indexOf(t) === i; }));
  }
  // what is on screen is asked first: a searched or opened stock gets its live price in seconds
  var urgent = [];
  function wantOnScreen() {
    if (!D || !D.finnhub || !marketOpen()) return;
    var now = Date.now() / 1000, seen = 0;
    document.querySelectorAll("#v-" + tab + " .card > button").forEach(function (b) {
      var t = String(b.dataset.id || "").split("|")[0];
      if (seen++ < 15 && t && !FUTURES.test(t) && urgent.indexOf(t) < 0 && !(live[t] && live[t].at && now - live[t].at < 90)) urgent.push(t);
    });
  }
  function liveStatus() {
    var lv = document.getElementById("live"), lt = document.getElementById("liveTxt");
    if (!lv || !D || D.login === "expired") return;
    if (!D.finnhub) { lv.className = "live"; lt.textContent = "Cloud prices"; return; }
    if (!marketOpen()) { lv.className = "live"; lt.textContent = liveOn ? "Market closed · last close" : "Market closed"; return; }
    if (liveOn && liveAt) { var s = Math.round((Date.now() - liveAt) / 1000); lv.className = "live on"; lt.textContent = "Live · " + (s < 60 ? s + "s ago" : Math.round(s / 60) + " min ago"); return; }
    lv.className = "live"; lt.textContent = "Connecting…";
  }
  function checkAlerts() {
    var fresh = freshAlerts().filter(function (r) { return !notified[alertKey(r)]; });
    if (!fresh.length) return;
    fresh.forEach(function (r) { notified[alertKey(r)] = 1; });
    try { if (navigator.vibrate) navigator.vibrate([90, 60, 90]); } catch (e) { /* not every phone vibrates */ }
    dirty = true;
  }
  function softRender() {
    if (!dirty) return;
    var s = document.activeElement && document.activeElement.id === "search";
    if (s) return;  // never redraw under the reader's typing
    dirty = false; render();
  }
  async function ask(t) {
    var r = await fetch("https://finnhub.io/api/v1/quote?symbol=" + encodeURIComponent(t) + "&token=" + encodeURIComponent(D.finnhub));
    if (r.status === 429) return "limit";
    var q = await r.json();
    if (!q || !isNum(q.c) || q.c <= 0) return "none";
    var old = live[t];
    live[t] = { c: q.c, t: q.t, at: Date.now() / 1000, dp: isNum(q.dp) ? q.dp : null, pc: q.pc,
                pend: old && old.c !== q.c ? Math.sign(q.c - old.c) : (old ? old.pend : 0) };
    if (!old || old.c !== q.c) dirty = true;
    return "ok";
  }
  async function liveLoop() {
    if (running) return;
    running = true;
    try {
      var first = true;
      while (D.finnhub && !document.hidden && (marketOpen() || first)) {
        var list = cycleList();
        if (!marketOpen()) list = list.slice(0, HOT_MAX);  // shut: one pass for the last close, then stop
        for (var i = 0; i < list.length && !document.hidden; i++) {
          var res = "none", t = urgent.length ? urgent.shift() : list[i];
          if (t !== list[i]) i--;  // an on-screen ticker went first; the cycle's own turn comes next
          try { res = await ask(t); } catch (e) { /* that ticker keeps its last price */ }
          if (res === "limit") { await new Promise(function (ok) { setTimeout(ok, 20000); }); break; }
          if (res === "ok") { liveAt = new Date(); liveOn = true; }
          if (i % 5 === 4) { checkAlerts(); softRender(); }
          await new Promise(function (ok) { setTimeout(ok, GAP_MS); });
        }
        checkAlerts(); softRender();
        first = false;
      }
    } finally { running = false; liveStatus(); }
  }
  function start() {
    render();
    setInterval(function () { liveStatus(); softRender(); }, 5000);
    setInterval(refreshData, 4 * 60000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) refreshData(); });
    if (!D.finnhub) return;
    loadEarnings();
    liveLoop();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) liveLoop(); });
    setInterval(function () { if (!document.hidden && marketOpen()) liveLoop(); }, 60000);  // picks up the opening bell
  }
})();
</script>
</body>
</html>
